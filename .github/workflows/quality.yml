name: research-quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BTC_STRATEGY_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q
      - run: python -m btc_strategy.verify --integrity --review --models --targets
      - run: python -m btc_strategy.replay --all
      - run: python -m btc_strategy.training --family price47 --year 2025
  isolated-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build -t btc-strategy-audit .
      - name: Offline readonly installed-wheel replay
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=1g
          --user "$(id -u):$(id -g)"
          --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/research,readonly"
          btc-strategy-audit python -I /research/scripts/verify_offline.py
